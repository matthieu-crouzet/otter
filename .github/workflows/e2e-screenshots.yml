name: E2E Screenshots

description: To work correctly this action must be run only on pull_request trigger and not coming from a fork

on:
  workflow_call:
    inputs:
      visualTestingReportPath:
        type: string
        description: 'Path to the visual testing report'
        required: true
      screenshotsPattern:
        type: string
        description: 'Pattern to detect which screenshots should be committed'
        required: true
      e2eReportArtifactName:
        type: string
        default: e2e-report
        description: This artifact should contains the visual testing report and the actual screenshots
        required: false

permissions:
  contents: write # Needed to create a commit in case of visual testing failure
  issues: write # Needed to add a comment to a pull request
  pull-requests: write # Needed to add a comment to a pull request

jobs:
  e2e-screenshots:
    runs-on: ubuntu-24.04
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup
      - uses: ./tools/github-actions/download-build-output
        with:
          artifactName: ${{ inputs.e2eReportArtifactName }}
      - name: Unzip artifact
        run: unzip -q -n ${{ inputs.e2eReportArtifactName }}.zip
        shell: bash
      - name: Update e2e screenshots
        uses: ./tools/github-actions/create-branch-e2e-screenshots
        with:
          visualTestingReportPath: ${{ inputs.visualTestingReportPath }}
          screenshotsPattern: ${{ inputs.screenshotsPattern }}
